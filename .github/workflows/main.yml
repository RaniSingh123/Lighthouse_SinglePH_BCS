name: LighoutBCS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test-publish:
    name: CI pipeline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MS Build
        uses: microsoft/setup-msbuild@v2

      - name: Restore Nuget Packages
        run: nuget restore LH_RnD_New.sln

      - name: Build
        run: msbuild LH_RnD_New.sln /p:Configuration=Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-framework-winApp
          path: '**/bin/Release/'

  deploy:
      name: Deploy LH_RnD_APP
      needs: build-test-publish
      runs-on: self-hosted

      steps:
        - name: Download Build Artifact
          uses: actions/download-Artifact@v4
          with:
              name: dotnet-framework-winApp
              path: E:\LH_RnD_Deploy
              
       

          
          
      
  

      
      
        
      
        
      
        
      
      

  
