name: LighoutBCS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test-publish:
    name: CI pipeline
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: downloadSDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '4.7.x'
  
      
      
      

  
